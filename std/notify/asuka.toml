name = "asuka/notify"
version = "0.1.0"
description = "Local notifications: now or later, actions and replies, threads, channels, messages, the badge"

[android]
permissions = ["android.permission.POST_NOTIFICATIONS"]

# The host's notify module (UserNotifications).
[ios]
hostFlags = ["ASUKA_NOTIFY"]

# Messages in conversations (a notification made a message by from, or
# made with its sender):
# communication notifications (their capability, the intent the app
# donates for each message).
[uses."Notification.from".ios]
hostFlags = ["ASUKA_CONVERSATIONS"]
entitlements = { "com.apple.developer.usernotifications.communication" = true }
plist = { NSUserActivityTypes = ["INSendMessageIntent"] }

[uses."Notification.sender".ios]
hostFlags = ["ASUKA_CONVERSATIONS"]
entitlements = { "com.apple.developer.usernotifications.communication" = true }
plist = { NSUserActivityTypes = ["INSendMessageIntent"] }
