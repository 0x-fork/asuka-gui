name = "asuka/compose"
version = "0.1.0"
description = "The system's mail and message composers"

# Whether an app takes mailto: and smsto: links: iOS's canOpenURL,
# Android 11's package visibility.
[ios.plist]
LSApplicationQueriesSchemes = ["mailto"]

[android]
manifest = ['<queries><intent><action android:name="android.intent.action.SENDTO" /><data android:scheme="mailto" /></intent><intent><action android:name="android.intent.action.SENDTO" /><data android:scheme="smsto" /></intent></queries>']

# The host's compose module (MessageUI).
[ios]
hostFlags = ["ASUKA_COMPOSE"]
