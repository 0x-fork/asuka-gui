name = "std/sqlite"
version = "0.1.0"
description = "The app's SQLite database: SQL off the main thread, typed rows, live queries"

# SQLite (its amalgamation, $sqlite) and asq, the one entry point the
# core calls a whole statement at a time (csrc/asq.h): compiled with the
# same options for every target, and linked into the apps that import
# std/sqlite. On the web it's a module of its own, which the page's SQLite
# worker runs.
[c]
sources = ["$sqlite/sqlite3.c", "csrc/asq.c"]
include = ["$sqlite", "csrc"]
defines = [
  "NDEBUG",
  "SQLITE_DEFAULT_MEMSTATUS=0",
  "SQLITE_DEFAULT_WAL_SYNCHRONOUS=1",
  "SQLITE_LIKE_DOESNT_MATCH_BLOBS",
  "SQLITE_OMIT_DEPRECATED",
  "SQLITE_OMIT_SHARED_CACHE",
  "SQLITE_OMIT_LOAD_EXTENSION",
  "SQLITE_USE_ALLOCA",
  # Temporary tables and indices in memory: a phone may have no temporary
  # directory SQLite finds (Android has no /tmp).
  "SQLITE_TEMP_STORE=2",
  "SQLITE_ENABLE_PREUPDATE_HOOK",
  "SQLITE_ENABLE_FTS5",
  "SQLITE_ENABLE_RTREE",
  "SQLITE_ENABLE_GEOPOLY",
  "SQLITE_ENABLE_MATH_FUNCTIONS",
  "SQLITE_ENABLE_DBSTAT_VTAB",
  "SQLITE_ENABLE_STAT4",
  "SQLITE_ENABLE_BYTECODE_VTAB",
  "SQLITE_SOUNDEX",
]
# Only what the core calls is the app's: SQLite's own names stay hidden in
# a shared library (Android's), so one another library loads never clashes.
flags = ["-fvisibility=hidden"]

# Multi-thread: the core uses a connection on one thread at a time (its
# statements run one after another on a thread of their own), so SQLite's
# own mutexes would only cost a lock per call. usleep (else SQLite's busy
# waits sleep whole seconds), localtime_r.
[c.ios]
defines = ["SQLITE_THREADSAFE=2", "HAVE_USLEEP=1", "HAVE_LOCALTIME_R=1", "HAVE_GMTIME_R=1", "HAVE_FDATASYNC=1"]

[c.macos]
defines = ["SQLITE_THREADSAFE=2", "HAVE_USLEEP=1", "HAVE_LOCALTIME_R=1", "HAVE_GMTIME_R=1", "HAVE_FDATASYNC=1"]

[c.android]
defines = ["SQLITE_THREADSAFE=2", "HAVE_USLEEP=1", "HAVE_LOCALTIME_R=1", "HAVE_GMTIME_R=1", "HAVE_FDATASYNC=1"]

[c.linux]
defines = ["SQLITE_THREADSAFE=2", "HAVE_USLEEP=1", "HAVE_LOCALTIME_R=1", "HAVE_GMTIME_R=1", "HAVE_FDATASYNC=1"]

[c.windows]
defines = ["SQLITE_THREADSAFE=2"]

# The web: SQLite's system is asq_wasm.c's (its files, locks, time and
# randomness are the worker's JavaScript, platform/web/src/sqlite-engine.js),
# one thread; optimized for size, as the page downloads it.
[c.web]
sources = ["csrc/asq_wasm.c"]
defines = ["SQLITE_OS_OTHER=1", "SQLITE_THREADSAFE=0", "HAVE_LOCALTIME_R=1"]
flags = ["-Os"]

# SQLite 3.54.1's amalgamation (sqlite3.c and sqlite3.h), as sqlite.org
# publishes it: in the public domain (https://www.sqlite.org/copyright.html),
# no license to ship it. Fetched by a build that compiles it (a release's
# prebuilt libraries have it compiled). To update: a newer release's URL
# and its SHA-256 (shasum -a 256).
[c.download.sqlite]
url = "https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip"
sha256 = "0a9c8e34352dad46006aa82836d5383bff9dc6bc9ce5a60553c05aa30e6ad1f9"
strip = 1
