name = "asuka/bluetooth"
version = "0.1.0"
description = "Bluetooth Low Energy: central and peripheral"

[ios]
usage = { NSBluetoothAlwaysUsageDescription = "To connect to your Bluetooth devices." }

[android]
# Android 12's nearby devices permissions: the scan's "neverForLocation"
# unless the app's asuka.toml has bluetooth.location (Asuka's Android is
# 13 and later, so not the older Bluetooth and location permissions).
permissions = ["android.permission.BLUETOOTH_SCAN|neverForLocation", "android.permission.BLUETOOTH_CONNECT", "android.permission.BLUETOOTH_ADVERTISE"]

# BlueZ, on the system bus, from a Flatpak.
[linux]
flatpak = ["--system-talk-name=org.bluez"]
