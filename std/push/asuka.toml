name = "asuka/push"
version = "0.1.0"
description = "Push notifications: the device's token, and the pushes that come and are opened"

# APNs: the Push Notifications capability (a release's profile must have
# it), and the pushes that wake the app.
[ios]
# The host's push module (APNs' registration and its notifications).
hostFlags = ["ASUKA_PUSH"]
backgroundModes = ["remote-notification"]
entitlements = { aps-environment = "development" }

# Firebase Cloud Messaging: the host's asuka-push module (its manifest has
# POST_NOTIFICATIONS and the messaging service).
[android]
hostModules = ["push"]

# A push shown as a message in a conversation (Message.from, or made with
# its sender):
# communication notifications, as notify's Notification.from.
[uses."Message.from".ios]
hostFlags = ["ASUKA_CONVERSATIONS"]
entitlements = { "com.apple.developer.usernotifications.communication" = true }
plist = { NSUserActivityTypes = ["INSendMessageIntent"] }

[uses."Message.sender".ios]
hostFlags = ["ASUKA_CONVERSATIONS"]
entitlements = { "com.apple.developer.usernotifications.communication" = true }
plist = { NSUserActivityTypes = ["INSendMessageIntent"] }
