name = "platform/periodic"
version = "0.1.0"
description = "Background refresh: work the system runs now and again, the app open or not"

# iOS's background tasks, by the identifiers the host schedules
# (AsukaPeriodic).
[ios]
# The host's periodic module (BGTaskScheduler).
hostFlags = ["ASUKA_PERIODIC"]
backgroundModes = ["fetch", "processing"]
plist = { BGTaskSchedulerPermittedIdentifiers = ["dev.asuka.refresh", "dev.asuka.processing"] }

# WorkManager: the host's asuka-periodic module.
[android]
hostModules = ["periodic"]
