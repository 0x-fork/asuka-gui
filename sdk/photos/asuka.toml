name = "platform/photos"
version = "0.1.0"
description = "The user's photo library, read with their permission"

[ios.usage]
NSPhotoLibraryUsageDescription = "To show your photos."

[android]
permissions = ["android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VISUAL_USER_SELECTED", "android.permission.READ_EXTERNAL_STORAGE:32"]

# The host's photo library module (PhotoKit).
[ios]
hostFlags = ["ASUKA_PHOTOLIBRARY"]
